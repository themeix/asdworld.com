---
layout: default
---
<div class="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10">
    
    <!-- Main Page Content (9 cols) -->
    <article class="lg:col-span-9 lg:pr-8 lg:border-r lg:border-dotted lg:border-[#cccccc] min-w-0">
      <h1 class="font-sans font-bold text-3xl sm:text-4xl text-[#333333] leading-snug mb-6">
        {{ page.title }}
      </h1>

      <div class="prose-custom font-sans leading-relaxed text-[#424242]">
        {{ content }}
      </div>
    </article>

    <!-- Sidebar (3 cols) -->
    <div class="lg:col-span-3 min-w-0">
      {% include sidebar.html %}
    </div>

  </div>
</div>
